name: CI/CD - Frontend Build, Test, Deploy (Dev Branch)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy-frontend:
    runs-on: self-hosted

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Login to Docker Hub
      - name: Docker Hub login
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

      # Build & push Docker image (commit SHA tag)
      - name: Build & push frontend image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ariana1/todo-frontend:$IMAGE_TAG .
          docker push ariana1/todo-frontend:$IMAGE_TAG

      # Set up kubectl
      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      # Write KUBECONFIG secret to file
      - name: Prepare Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > $HOME/kubeconfig.yaml
          export KUBECONFIG=$HOME/kubeconfig.yaml
          kubectl config view

      # Deploy to Kubernetes using the new image
      - name: Deploy to Kubernetes
        run: |
          IMAGE_TAG=${{ github.sha }}
          export KUBECONFIG=$HOME/kubeconfig.yaml
          kubectl set image deployment/todo-frontend todo-frontend=ariana1/todo-frontend:$IMAGE_TAG -n workload
          kubectl rollout status deployment/todo-frontend -n workload

      # Verify frontend deployment
      - name: Verify frontend
        run: |
          export KUBECONFIG=$HOME/kubeconfig.yaml
          echo "Frontend pods:"
          kubectl get pods -n workload -l app=todo-frontend
          echo "Frontend service info:"
          kubectl get svc -n workload todo-frontend-service
